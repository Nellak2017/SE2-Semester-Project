version: "2"
plugins:
- name: "fsharp"
  wasm:
    url: "https://github.com/kaashyapan/sqlc-gen-fsharp/releases/download/v1.0.1/sqlc-gen-fsharp.wasm"
    sha256: "fe0428d7cf1635b640d288be1ecfcc246ea15f882b397317394ee0d3108bdc81"
sql:
- engine: "postgresql"
  schema: "src/Infrastructure/WebServer.Infrastructure/Persistence/schema.sql"
  queries: "src/Infrastructure/WebServer.Infrastructure/Persistence/queries.sql"
  codegen:
  - out: "src/Infrastructure/WebServer.Infrastructure/Persistence/SQLc"
    plugin: fsharp
    options:
      namespace: "SE2.Infrastructure.Persistence.SQLc"
      async: false
      type_affinity: true